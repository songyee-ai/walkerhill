name: check

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 충돌 표시 검사
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- . ':!.github/workflows/check.yml'; then
            echo "::error::충돌 표시가 남아 있습니다. 위 파일을 정리한 뒤 다시 푸시하세요."
            exit 1
          fi
          echo "충돌 표시 없음"

      - name: main 이 develop 에 들어 있는 커밋인지 검사
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin develop
          if ! git merge-base --is-ancestor HEAD origin/develop; then
            echo "::error::main 에 develop 에 없는 커밋이 있습니다. main 에서 따로 고치지 않습니다."
            exit 1
          fi
          echo "main 은 develop 과 같은 흐름"

      - name: 문서 동반 검사
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git -c core.quotepath=false diff --name-only "origin/$BASE_REF...HEAD")
          code=$(echo "$changed" | grep -vE '(^docs/|\.md$)' || true)
          if [ -n "$code" ] && ! echo "$changed" | grep -qx 'docs/PROGRESS.md'; then
            echo "::error::문서가 아닌 파일을 바꿨는데 docs/PROGRESS.md 가 함께 바뀌지 않았습니다."
            echo "문서가 아닌 변경 파일:"
            echo "$code"
            exit 1
          fi
          echo "문서 동반 확인"

      # ── 여기부터는 코드와 데이터 파일의 검사다 (CLAUDE.md 의 "스택" 절) ──

      # 판 번호를 끝까지 적는다. 이 액션은 v10 처럼 앞 번호만 적은 태그를 두지 않는다 (11-13 확인).
      - name: uv 설치
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: 패키지 설치 (잠금 파일 그대로)
        run: uv sync --locked

      - name: 린트
        run: uv run ruff check .

      - name: 형식 검사
        run: |
          uv run python -m tools.check_formats
          uv run python -m tools.check_formats --root tests/fixtures/example --strict

      - name: 테스트
        run: uv run python -m pytest
