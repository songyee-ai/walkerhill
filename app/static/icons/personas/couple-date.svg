<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 1 72 58" role="img" aria-labelledby="name detail">
  <title id="name">일상 데이트를 하는 부부·연인</title>
  <desc id="detail">사선으로 마주 놓인 커피잔</desc>
  <style>:root{color-scheme:light dark;--ink:light-dark(#49594e,#34463b);--paper:light-dark(#fffdf2,#eceee1);--side:light-dark(#ced6c8,#a8b9a8);--mid:light-dark(#9daf9f,#97ab98);--forest:light-dark(#3f6150,#6f8c76);--shadow:light-dark(#d9dfd1,#3c4b41);--stone:light-dark(#ecede1,#889b8b);}
    .model{fill:none;stroke:var(--ink);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
    .paper{fill:var(--paper)} .stone{fill:var(--stone)} .side{fill:var(--side)}
    .mid{fill:var(--mid)} .forest{fill:var(--forest)}
    .thin,.fine{fill:none} .thin{stroke-width:.9} .fine{stroke-width:1.05}
    .glint{fill:none;stroke:var(--paper);stroke-width:1.3}
    .nostroke{stroke:none} .seam{stroke-width:.65}
    .porcelain{fill:light-dark(#c2d8db,#c1d7dc)} .glaze{fill:light-dark(#92b3bd,#93afb7)} .espresso{fill:light-dark(#845840,#885e48)}
  </style>
