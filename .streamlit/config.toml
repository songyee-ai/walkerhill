# 화면(Streamlit)의 설정. 공통 틀이다 (docs/STRUCTURE.md).

[server]
# 이 PC 에서만 접속되게 한다. 기본값으로 두면 같은 네트워크의 다른 기기에서도 화면이 열리는데,
# 화면에는 내부 자료에서 계산한 값이 나올 수 있다 (2026-11-13).
address = "localhost"
# 결과 화면의 배너 그림과 아이콘(app/static/)을 /app/static/… 주소로 내준다 (2026-11-21, T130).
# 그림은 팀장이 GPT 로 만든 것이고 실제 상표·얼굴·글자가 없다. 내부 자료는 이 폴더에 두지 않는다.
enableStaticServing = true

[browser]
# 사용 통계를 밖으로 보내지 않는다 (2026-11-13).
gatherUsageStats = false

# 화면의 강조색. 화면 쪽 CSS(app/style.py)가 덧입히지 못하는 곳(라디오 버튼의 점 등)이 Streamlit 기본 빨강으로 남아,
# 화면 담당의 요청으로 같은 indigo 로 맞춘다 (2026-11-16, docs/PROGRESS.md 의 T110).
# [theme] 한 칸에 적지 않는다. 그렇게 적으면 밝은 테마로 고정돼, 어두운 화면을 쓰는 PC 에서도 밝게 뜬다 (2026-11-16, Streamlit 1.66.0 에서 확인).
[theme.light]
primaryColor = "#4f46e5"

[theme.dark]
primaryColor = "#4f46e5"
